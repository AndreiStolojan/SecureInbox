x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:8.0.28@sha256:5351bff2b5d1563e3fa603a74b9be85ef9323e10aeb0b45cea933a93876e77fd
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-secureinbox}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-secureinbox_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: development
      PORT: "5500"
      DB_URI: mongodb://${MONGO_ROOT_USERNAME:-secureinbox_root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-secureinbox}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      MAIL_TOKEN_ENCRYPTION_KEY: ${MAIL_TOKEN_ENCRYPTION_KEY}
      FRONTEND_APP_URL: http://localhost:${APP_PORT:-8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/mail-accounts/google/callback}
      GMAIL_PUSH_ENABLED: ${GMAIL_PUSH_ENABLED:-false}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      GMAIL_PUSH_AUDIENCE: ${GMAIL_PUSH_AUDIENCE:-}
      GMAIL_PUSH_SERVICE_ACCOUNT_EMAIL: ${GMAIL_PUSH_SERVICE_ACCOUNT_EMAIL:-}
      GMAIL_POLL_INTERVAL_WITH_PUSH: ${GMAIL_POLL_INTERVAL_WITH_PUSH:-60}
      THREAT_INTEL_ENABLED: ${THREAT_INTEL_ENABLED:-false}
      WEB_RISK_API_KEY: ${WEB_RISK_API_KEY:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      THREAT_INTEL_MAX_URLS_PER_EMAIL: ${THREAT_INTEL_MAX_URLS_PER_EMAIL:-5}
      THREAT_INTEL_TIMEOUT_MS: ${THREAT_INTEL_TIMEOUT_MS:-10000}
      ATTACHMENT_ANALYSIS_ENABLED: ${ATTACHMENT_ANALYSIS_ENABLED:-false}
      ATTACHMENT_ANALYSIS_CONCURRENCY: ${ATTACHMENT_ANALYSIS_CONCURRENCY:-3}
      ATTACHMENT_ANALYSIS_TIMEOUT_MS: ${ATTACHMENT_ANALYSIS_TIMEOUT_MS:-15000}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      ARCJET_KEY: ${ARCJET_KEY:-}
      ARCJET_ENV: ${ARCJET_ENV:-development}
      AI_SEMANTIC_ENABLED: ${AI_SEMANTIC_ENABLED:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-300000}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-1}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Demo User}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@secureinbox.test}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    expose:
      - "5500"
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5500/api/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.32.1@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      # Must stay ABOVE SYNC_INTERVAL_MINUTES. At 10m with a 15m sync the model
      # was evicted between every cycle, so each scan run began by reloading
      # ~4.7 GB from disk before doing any work.
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  mongo-data:
  ollama-data:
  prometheus-data:
  grafana-data:
