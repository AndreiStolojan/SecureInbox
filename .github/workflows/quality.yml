name: Quality

on:
  push:
    branches: [main, prod]
  # No branch filter. Restricting this to [main, prod] meant a pull request
  # targeting any other branch got no checks at all, which is exactly what
  # stacked pull requests do: only the bottom of the stack was ever verified,
  # and the rest ran for the first time after being retargeted on merge.
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.5.0, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --prefix backend && npm run lint --prefix backend && npm test --prefix backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.5.0, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --prefix frontend && npm test --prefix frontend && npm run build --prefix frontend
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.5.0 }
      - run: npm ci --prefix backend --ignore-scripts
      - run: bash -n provision scripts/dotenv.sh scripts/backup scripts/restore tests/provisioning.test.sh && bash tests/provisioning.test.sh
      - run: |
          # Every command below that reaches Docker Hub is a third-party network
          # call on an unauthenticated runner, and those fail intermittently —
          # "registry-1.docker.io: context deadline exceeded" has failed this job
          # on an unmodified tree. Retry so a registry hiccup is not reported as
          # a code defect; a genuine problem still fails after three attempts.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "::warning::attempt ${attempt} failed: $* — retrying"
              sleep $((attempt * 10))
            done
            echo "::error::failed after 3 attempts: $*"
            return 1
          }

          env_file="$RUNNER_TEMP/secureinbox.env"
          PROVISION_ENV_FILE="$env_file" bash -c 'source ./provision; create_env; load_runtime_values'
          test "$(stat -c %a "$env_file")" = 600
          docker compose --env-file "$env_file" config --quiet
          cp backend/.env.production.local.example backend/.env.production.local
          TUNNEL_TOKEN=ci docker compose -f docker-compose.prod.yml config --quiet
          (
            cd backend
            if NODE_ENV=production PORT=5500 DB_URI=mongodb://example.test/db JWT_SECRET=x JWT_EXPIRES_IN=1h MAIL_TOKEN_ENCRYPTION_KEY=x node --input-type=module -e "await import('./src/config/env.js')"; then exit 1; fi
            NODE_ENV=production PORT=5500 DB_URI=mongodb://example.test/db JWT_SECRET=x JWT_EXPIRES_IN=1h MAIL_TOKEN_ENCRYPTION_KEY=x GOOGLE_CLIENT_ID=x GOOGLE_CLIENT_SECRET=x GOOGLE_REDIRECT_URI=https://example.test/callback FRONTEND_APP_URL=https://example.test EMAIL_FROM=no-reply@example.test EMAIL_PASSWORD=x node --input-type=module -e "await import('./src/config/env.js')"
          )
          rm backend/.env.production.local
          retry docker run --rm --add-host backend:127.0.0.1 --add-host cloudflared:127.0.0.2 -v "$PWD/frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46 nginx -t
          retry docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac check config /etc/prometheus/prometheus.yml
          node -e "const d=require('./monitoring/grafana/dashboards/secureinbox-local.json');const p=Object.fromEntries(d.panels.map(x=>[x.id,x]));if(!d.panels.every(({gridPos})=>Number.isInteger(gridPos?.x)&&Number.isInteger(gridPos?.y)&&Number.isInteger(gridPos?.w)&&Number.isInteger(gridPos?.h))||!p[3].targets[0].expr.includes('clamp_min')||p[3].fieldConfig.defaults.unit!=='percentunit'||!p[6].targets[0].expr.includes('[1h]')||p[4].targets.length!==1||!p[4].targets[0].expr.includes('histogram_quantile(0.95')||p[7].fieldConfig.defaults.unit!=='dateTimeAsLocal')process.exit(1)"
          images="$( { awk '/^[[:space:]]*image:/{print $2}' docker-compose.yml docker-compose.prod.yml; awk '/^FROM /{print $2}' backend/Dockerfile frontend/Dockerfile; } | sort -u )"
          while IFS= read -r image; do
            test -z "$image" && continue
            [[ "$image" == *@sha256:* ]]
            manifest="$(retry docker buildx imagetools inspect "$image")"
            grep -q linux/arm64 <<< "$manifest"
          done <<< "$images"
  integration:
    needs: [backend, frontend, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.5.0 }
      - name: Start disposable local stack
        run: |
          PROVISION_ENV_FILE=.env bash -c 'source ./provision; create_env'
          docker compose up -d --build --wait --wait-timeout 180
          docker compose exec -T backend npm run seed:local
          curl --fail http://127.0.0.1:8080/api/v1/ready
          # Sampled once, this raced: `up --wait` returns when healthchecks first
          # pass, but a probe can report "starting" again on its next interval —
          # ollama's `ollama list` does while it settles — and the job then failed
          # on an unmodified tree. Poll instead, so the assertion still has to be
          # satisfied but is not decided by which second we happened to look.
          for attempt in $(seq 1 30); do
            services="$(docker compose ps --format '{{.Service}} {{.Health}}')"
            if awk 'NF != 2 || $2 != "healthy" { bad = 1 } END { exit NR == 6 && !bad ? 0 : 1 }' <<< "$services"; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::services never all reported healthy"
              echo "$services"
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T backend node -e "fetch('http://127.0.0.1:5500/metrics').then(r=>r.text()).then(t=>process.exit(t.includes('secureinbox_http_requests_total') ? 0 : 1))"
          login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' --data '{"email":"demo@secureinbox.test","password":"'"$(awk -F= '/^DEMO_USER_PASSWORD=/{print $2}' .env)"'"}' http://127.0.0.1:8080/api/v1/auth/login)"
          token="$(node -e 'console.log(JSON.parse(process.argv[1]).data.token)' "$login")"
          gmail_response="$(curl --silent -w '\n%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:8080/api/v1/mail-accounts/google/start)"
          test "${gmail_response##*$'\n'}" = 503
          node -e 'if (JSON.parse(process.argv[1]).code !== "INTEGRATION_NOT_CONFIGURED") process.exit(1)' "${gmail_response%$'\n'*}"
          counts="$(docker compose exec -T mongodb mongosh --quiet --username secureinbox_root --password "$(awk -F= '/^MONGO_ROOT_PASSWORD=/{print $2}' .env)" --authenticationDatabase admin --eval 'const d=db.getSiblingDB("secureinbox"); print(JSON.stringify({users:d.users.countDocuments({}),emails:d.emails.countDocuments({}),scans:d.scans.countDocuments({})}))')"
          test "$counts" = '{"users":1,"emails":6,"scans":6}'
          # Prometheus scrapes every 15s, and these ran immediately after the
          # stack came up — before the first scrape of the backend had happened.
          # With no matching target, `jq -e` produces no output and exits 4,
          # which is the exit code this job kept failing with. Wait for the
          # first scrape instead of racing it; the assertions are unchanged.
          await() {
            local description="$1"; shift
            local attempt
            for attempt in $(seq 1 40); do
              if "$@" > /dev/null 2>&1; then return 0; fi
              sleep 3
            done
            echo "::error::${description} did not become true within 120s"
            "$@" || true
            return 1
          }

          check_backend_target() {
            curl --fail --silent http://127.0.0.1:9090/api/v1/targets \
              | jq -e '.data.activeTargets[] | select(.labels.job == "secureinbox-backend" and .health == "up")'
          }
          check_grafana_dashboard() {
            curl --fail --silent -u "$(awk -F= '/^GRAFANA_ADMIN_USER=/{print $2}' .env):$(awk -F= '/^GRAFANA_ADMIN_PASSWORD=/{print $2}' .env)" \
              "http://127.0.0.1:3000/api/search?query=SecureInbox" | jq -e 'any(.[]; .title == "SecureInbox Local")'
          }

          await "prometheus backend target up" check_backend_target
          await "grafana dashboard provisioned" check_grafana_dashboard
          ./scripts/backup
          test "$(stat -c %a backups)" = 700
          archive="$(find backups -name '*.archive.gz' -print -quit)"
          ./scripts/restore "$archive" --confirm-replace
          counts="$(docker compose exec -T mongodb mongosh --quiet --username secureinbox_root --password "$(awk -F= '/^MONGO_ROOT_PASSWORD=/{print $2}' .env)" --authenticationDatabase admin --eval 'const d=db.getSiblingDB("secureinbox"); print(JSON.stringify({users:d.users.countDocuments({}),emails:d.emails.countDocuments({}),scans:d.scans.countDocuments({})}))')"
          test "$counts" = '{"users":1,"emails":6,"scans":6}'
      - if: always()
        run: docker compose down --volumes --remove-orphans
